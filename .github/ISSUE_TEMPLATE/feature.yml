name: Feature request
description: Suggest a focused Freenetic improvement
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest native OpenWrt-based solution you would find useful.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Compatibility principles
      options:
        - label: This does not require Freenetic to replace a native OpenWrt service.
          required: true
        - label: This does not require deleting or overwriting configuration Freenetic did not create.
          required: true
